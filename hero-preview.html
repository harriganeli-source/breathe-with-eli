<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Preview — White Embossed Mandala</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .hero--mandala {
            background: #eaeaea;
        }

        .hero--mandala::before {
            display: none;
        }

        /* Non-rotated wrapper — drop-shadow here stays in screen space */
        .mandala-hover-container .chevron-wrap {
            position: absolute;
            pointer-events: auto;
            /* filter set per-frame in JS */
        }

        /* Individual chevron arms — white pills */
        .chevron-arm {
            position: absolute;
            width: 26px;
            height: 7px;
            border-radius: 4px;
            background: #eaeaea;
            top: 50%;
            left: 50%;
        }

        @media (max-width: 768px) {
            .chevron-arm {
                width: 18px;
                height: 5px;
                border-radius: 3px;
            }
        }

        .mandala-hover-container .chevron-wrap.scroll-chevron {
            cursor: pointer;
            animation: chevron-scroll-bounce 2s ease-in-out infinite;
        }

        .preview-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2d2d2d;
            color: #fff;
            text-align: center;
            padding: 0.5rem 1rem;
            font-family: Inter, sans-serif;
            font-size: 0.85rem;
            z-index: 9999;
        }
        .preview-banner a {
            color: #c4a77d;
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="preview-banner">
        Preview: White Embossed Mandala
        <a href="index.html">View current homepage</a>
    </div>

    <section class="hero hero--mandala">
        <div class="mandala-hover-container" id="hero-mandala"></div>
        <div class="hero-content">
            <h1>Come Home to Yourself</h1>
            <p class="hero-subtitle">Get out of your head and back into your body.<br class="desktop-only"> Private sessions, workshops, and men's groups.</p>
            <div class="mandala-mobile" id="hero-mandala-mobile"></div>
            <div class="hero-buttons">
                <a href="#mailing-list" class="btn btn-primary">Join the Mailing List</a>
                <a href="work-with-me.html" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
        <a href="#intro" class="scroll-indicator" aria-label="Scroll to content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
            </svg>
        </a>
    </section>

    <script>
    (function() {
        const isMobile = window.innerWidth <= 768;
        const container = isMobile
            ? document.getElementById('hero-mandala-mobile')
            : document.getElementById('hero-mandala');
        const heroSection = document.querySelector('.hero--mandala');
        if (!container || !heroSection) return;

        const numChevrons = isMobile ? 6 : 12;
        const baseRadius = isMobile ? 60 : 290;
        const breathAmount = 6;
        const hoverExpandAmount = 40;
        const breathDuration = 8000;
        const hoverEaseSpeed = 0.015;
        const wrappers = [];
        const chevronState = [];

        // Shadow direction in screen space: low raking light from upper-left
        // Long shadows = light is close to the surface plane
        const shadowBaseX = 6;
        const shadowBaseY = 8;
        const shadowBaseBlur = 8;

        // Highlight direction (opposite)
        const highlightBaseX = -3;
        const highlightBaseY = -3;
        const highlightBaseBlur = 6;

        // Entrance animation
        const entranceDelay = 300;
        const entranceDuration = 2000;
        const entranceStartRadius = 1.4;
        const entranceStartTime = Date.now() + entranceDelay;
        let entranceComplete = false;
        let bottomFlipped = false;
        const bottomIndex = Math.floor(numChevrons * 0.25);

        for (let i = 0; i < numChevrons; i++) {
            const angle = (i / numChevrons) * Math.PI * 2;

            // Non-rotated wrapper — drop-shadow applied here stays in screen space
            const wrap = document.createElement('div');
            wrap.className = 'chevron-wrap';
            wrap.style.opacity = '0';

            // Two arms forming ">" pointing outward at this angle
            // Arm 1: upper arm of the chevron
            const arm1 = document.createElement('div');
            arm1.className = 'chevron-arm';
            const arm1Angle = (angle * 180 / Math.PI) + 45;
            arm1.style.transform = `translate(-100%, -50%) rotate(${arm1Angle}deg)`;
            arm1.style.transformOrigin = 'right center';

            // Arm 2: lower arm of the chevron
            const arm2 = document.createElement('div');
            arm2.className = 'chevron-arm';
            const arm2Angle = (angle * 180 / Math.PI) - 45;
            arm2.style.transform = `translate(-100%, -50%) rotate(${arm2Angle}deg)`;
            arm2.style.transformOrigin = 'right center';

            wrap.appendChild(arm1);
            wrap.appendChild(arm2);
            container.appendChild(wrap);
            wrappers.push(wrap);
            chevronState.push({
                angle: angle,
                currentOffset: 0,
                targetOffset: 0,
                collapseTimeout: null,
                entranceStagger: i * (300 / numChevrons)
            });
        }

        function updatePosition(index, breathProgress, now) {
            const wrap = wrappers[index];
            const state = chevronState[index];

            state.currentOffset += (state.targetOffset - state.currentOffset) * hoverEaseSpeed;

            // Entrance
            let entranceProgress = 1;
            let entranceRadiusMultiplier = 1;
            let entranceOpacity = 1;

            if (!entranceComplete) {
                const elapsed = now - entranceStartTime - state.entranceStagger;
                if (elapsed < 0) {
                    entranceProgress = 0;
                } else if (elapsed < entranceDuration) {
                    const t = elapsed / entranceDuration;
                    entranceProgress = 1 - Math.pow(1 - t, 3);
                }
                entranceRadiusMultiplier = entranceStartRadius - (entranceStartRadius - 1) * entranceProgress;
                entranceOpacity = Math.min(1, entranceProgress * 3);
            }

            const breathOffset = Math.sin(breathProgress * Math.PI * 2) * breathAmount;
            const currentRadius = (baseRadius + breathOffset + state.currentOffset) * entranceRadiusMultiplier;

            const x = Math.cos(state.angle) * currentRadius;
            const y = Math.sin(state.angle) * currentRadius;

            wrap.style.left = `calc(50% + ${x}px)`;
            wrap.style.top = `calc(50% + ${y}px)`;
            wrap.style.opacity = entranceOpacity;

            // Breathing controls shadow length — shapes rise and settle
            const breathValue = (Math.sin(breathProgress * Math.PI * 2) + 1) / 2;
            const elevation = 1 + breathValue * 1.5;

            const sx = shadowBaseX * elevation;
            const sy = shadowBaseY * elevation;
            const sBlur = shadowBaseBlur + breathValue * 8;
            const sOpacity = 0.18 + breathValue * 0.12;

            const hx = highlightBaseX * elevation;
            const hy = highlightBaseY * elevation;
            const hBlur = highlightBaseBlur + breathValue * 4;
            const hOpacity = 0.5 + breathValue * 0.4;

            wrap.style.filter =
                `drop-shadow(${sx.toFixed(1)}px ${sy.toFixed(1)}px ${sBlur.toFixed(1)}px rgba(0,0,0,${sOpacity.toFixed(2)})) ` +
                `drop-shadow(${hx.toFixed(1)}px ${hy.toFixed(1)}px ${hBlur.toFixed(1)}px rgba(255,255,255,${hOpacity.toFixed(2)}))`;

            if (index === bottomIndex && bottomFlipped) {
                // Override arm rotations to point down as scroll indicator
                const arms = wrap.querySelectorAll('.chevron-arm');
                arms[0].style.transform = `translate(-100%, -50%) rotate(45deg)`;
                arms[0].style.transformOrigin = 'right center';
                arms[1].style.transform = `translate(-100%, -50%) rotate(-45deg)`;
                arms[1].style.transformOrigin = 'right center';
            }
        }

        function animateBreathing() {
            const now = Date.now();
            const breathProgress = (now % breathDuration) / breathDuration;

            for (let i = 0; i < wrappers.length; i++) {
                updatePosition(i, breathProgress, now);
            }

            if (!entranceComplete) {
                const lastFinish = entranceStartTime + chevronState[chevronState.length - 1].entranceStagger + entranceDuration;
                if (now > lastFinish) {
                    entranceComplete = true;
                    if (!isMobile) {
                        setTimeout(() => {
                            const bw = wrappers[bottomIndex];
                            // Quick scale-down-up as transition
                            bw.style.transition = 'transform 0.6s ease-in-out';
                            bw.style.transform = 'scale(0.8)';
                            setTimeout(() => {
                                bottomFlipped = true;
                                bw.style.transform = 'scale(1)';
                                bw.classList.add('scroll-chevron');

                                const clickOverlay = document.createElement('div');
                                clickOverlay.className = 'scroll-chevron-clickarea';
                                clickOverlay.style.left = '50%';
                                clickOverlay.style.bottom = '0';
                                clickOverlay.style.transform = 'translateX(-50%)';
                                container.appendChild(clickOverlay);

                                const scrollToIntro = () => {
                                    const intro = document.getElementById('intro');
                                    if (intro) {
                                        const navHeight = document.querySelector('.navbar') ? document.querySelector('.navbar').offsetHeight : 0;
                                        const targetPosition = intro.getBoundingClientRect().top + window.pageYOffset - navHeight;
                                        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                                    }
                                };

                                bw.addEventListener('click', scrollToIntro);
                                clickOverlay.addEventListener('click', scrollToIntro);
                            }, 600);
                        }, 1500);
                    }
                }
            }

            requestAnimationFrame(animateBreathing);
        }

        function expandChevron(index) {
            const state = chevronState[index];
            state.targetOffset = hoverExpandAmount;
            if (state.collapseTimeout) clearTimeout(state.collapseTimeout);
            state.collapseTimeout = setTimeout(() => {
                collapseChevron(index);
            }, 800);
        }

        function collapseChevron(index) {
            chevronState[index].targetOffset = 0;
            chevronState[index].collapseTimeout = null;
        }

        heroSection.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - rect.width / 2;
            const mouseY = e.clientY - rect.top - rect.height / 2;

            for (let i = 0; i < chevronState.length; i++) {
                const state = chevronState[i];
                const checkX = Math.cos(state.angle) * baseRadius;
                const checkY = Math.sin(state.angle) * baseRadius;
                const dx = mouseX - checkX;
                const dy = mouseY - checkY;
                if (Math.sqrt(dx * dx + dy * dy) < 100) {
                    expandChevron(i);
                }
            }
        });

        animateBreathing();
    })();
    </script>
</body>
</html>
