<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Preview — White Embossed Mandala</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* Override hero background to pure white */
        .hero--mandala {
            background: #ffffff;
        }

        /* Remove noise texture overlay */
        .hero--mandala::before {
            display: none;
        }

        /* Hide default chevron pseudo-elements — we use real child elements now */
        .mandala-hover-container .petal::before,
        .mandala-hover-container .petal::after {
            display: none;
        }

        /* Petal: single curved arc piece */
        .mandala-hover-container .petal {
            position: absolute;
            pointer-events: auto;
        }

        .petal-shape {
            width: 55px;
            height: 28px;
            border-top: 7px solid #ffffff;
            border-left: none;
            border-right: none;
            border-bottom: none;
            border-radius: 50%;
            background: transparent;
            /* Shadow applied via inline style in JS for directional lighting */
        }

        /* Mobile: slightly smaller petals */
        @media (max-width: 768px) {
            .petal-shape {
                width: 38px;
                height: 20px;
                border-top-width: 5px;
            }
        }

        /* Scroll indicator override for petal */
        .mandala-hover-container .petal.scroll-chevron {
            cursor: pointer;
            animation: chevron-scroll-bounce 2s ease-in-out infinite;
        }

        /* Preview-only: side-by-side link */
        .preview-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2d2d2d;
            color: #fff;
            text-align: center;
            padding: 0.5rem 1rem;
            font-family: Inter, sans-serif;
            font-size: 0.85rem;
            z-index: 9999;
        }
        .preview-banner a {
            color: #c4a77d;
            margin-left: 1rem;
        }
    </style>
</head>
<body>
    <div class="preview-banner">
        Preview: White Embossed Mandala
        <a href="index.html">View current homepage</a>
    </div>

    <!-- Hero Section -->
    <section class="hero hero--mandala">
        <div class="mandala-hover-container" id="hero-mandala"></div>
        <div class="hero-content">
            <h1>Come Home to Yourself</h1>
            <p class="hero-subtitle">Get out of your head and back into your body.<br class="desktop-only"> Private sessions, workshops, and men's groups.</p>
            <div class="mandala-mobile" id="hero-mandala-mobile"></div>
            <div class="hero-buttons">
                <a href="#mailing-list" class="btn btn-primary">Join the Mailing List</a>
                <a href="work-with-me.html" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
        <a href="#intro" class="scroll-indicator" aria-label="Scroll to content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
            </svg>
        </a>
    </section>

    <script>
    // Interactive Hover Mandala — White Embossed Curved Petals
    (function() {
        const isMobile = window.innerWidth <= 768;
        const container = isMobile
            ? document.getElementById('hero-mandala-mobile')
            : document.getElementById('hero-mandala');
        const heroSection = document.querySelector('.hero--mandala');
        if (!container || !heroSection) return;

        const numPetals = isMobile ? 6 : 12;
        const baseRadius = isMobile ? 60 : 290;
        const breathAmount = 6;
        const hoverExpandAmount = 40;
        const breathDuration = 8000;
        const hoverEaseSpeed = 0.015;
        const petals = [];
        const petalShapes = [];
        const petalState = [];

        // Light source: upper-left. Shadows fall toward lower-right in screen space.
        const screenShadowX = 3;
        const screenShadowY = 4;
        const baseShadowBlur = 5;
        const breathShadowExtra = 4;

        // Entrance animation
        const entranceDelay = 300;
        const entranceDuration = 2000;
        const entranceStartRadius = 1.4;
        const entranceStartTime = Date.now() + entranceDelay;
        let entranceComplete = false;
        let bottomPetalFlipped = false;
        const bottomPetalIndex = Math.floor(numPetals * 0.25);

        // Create petals — single curved arc pieces
        for (let i = 0; i < numPetals; i++) {
            const angle = (i / numPetals) * Math.PI * 2;

            const petal = document.createElement('div');
            petal.className = 'petal';

            // Rotate so the arc curves along the ring (tangent), curving outward
            const rotation = (angle * 180 / Math.PI) + 180;
            petal.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
            petal.style.opacity = '0';

            // Inner shape element — the visible curved arc
            const shape = document.createElement('div');
            shape.className = 'petal-shape';
            petal.appendChild(shape);

            // Counter-rotate shadow for this petal's rotation so shadows
            // all fall toward lower-right in screen space
            const rotRad = rotation * Math.PI / 180;
            const theta = -rotRad;
            const localShadowX = screenShadowX * Math.cos(theta) - screenShadowY * Math.sin(theta);
            const localShadowY = screenShadowX * Math.sin(theta) + screenShadowY * Math.cos(theta);

            container.appendChild(petal);
            petals.push(petal);
            petalShapes.push(shape);
            petalState.push({
                angle: angle,
                currentOffset: 0,
                targetOffset: 0,
                collapseTimeout: null,
                entranceStagger: i * (300 / numPetals),
                localShadowX: localShadowX,
                localShadowY: localShadowY
            });
        }

        function updatePetalPosition(index, breathProgress, now) {
            const petal = petals[index];
            const shape = petalShapes[index];
            const state = petalState[index];

            state.currentOffset += (state.targetOffset - state.currentOffset) * hoverEaseSpeed;

            // Entrance animation
            let entranceProgress = 1;
            let entranceRadiusMultiplier = 1;
            let entranceOpacity = 1;

            if (!entranceComplete) {
                const entranceElapsed = now - entranceStartTime - state.entranceStagger;
                if (entranceElapsed < 0) {
                    entranceProgress = 0;
                } else if (entranceElapsed < entranceDuration) {
                    const t = entranceElapsed / entranceDuration;
                    entranceProgress = 1 - Math.pow(1 - t, 3);
                }
                entranceRadiusMultiplier = entranceStartRadius - (entranceStartRadius - 1) * entranceProgress;
                entranceOpacity = Math.min(1, entranceProgress * 3);
            }

            // Breathing radius
            const breathOffset = Math.sin(breathProgress * Math.PI * 2) * breathAmount;
            const currentRadius = (baseRadius + breathOffset + state.currentOffset) * entranceRadiusMultiplier;

            const x = Math.cos(state.angle) * currentRadius;
            const y = Math.sin(state.angle) * currentRadius;

            petal.style.left = `calc(50% + ${x}px)`;
            petal.style.top = `calc(50% + ${y}px)`;
            petal.style.opacity = entranceOpacity;

            // Breathing shadow: depth varies with breath cycle
            const breathValue = (Math.sin(breathProgress * Math.PI * 2) + 1) / 2; // 0 to 1
            const shadowScale = 1 + breathValue * 0.8;
            const blur = baseShadowBlur + breathValue * breathShadowExtra;
            const opacity = 0.10 + breathValue * 0.08;

            const sx = state.localShadowX * shadowScale;
            const sy = state.localShadowY * shadowScale;

            shape.style.filter = `drop-shadow(${sx.toFixed(1)}px ${sy.toFixed(1)}px ${blur.toFixed(1)}px rgba(0, 0, 0, ${opacity.toFixed(2)}))`;

            // Bottom petal scroll indicator
            if (index === bottomPetalIndex && bottomPetalFlipped) {
                petal.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            }
        }

        function animateBreathing() {
            const now = Date.now();
            const breathProgress = (now % breathDuration) / breathDuration;

            for (let i = 0; i < petals.length; i++) {
                updatePetalPosition(i, breathProgress, now);
            }

            if (!entranceComplete) {
                const lastPetalFinish = entranceStartTime + petalState[petalState.length - 1].entranceStagger + entranceDuration;
                if (now > lastPetalFinish) {
                    entranceComplete = true;
                    if (!isMobile) {
                        setTimeout(() => {
                            const bottomPetal = petals[bottomPetalIndex];
                            bottomPetal.classList.add('chevron-spinning');
                            setTimeout(() => {
                                bottomPetalFlipped = true;
                                bottomPetal.classList.remove('chevron-spinning');
                                bottomPetal.classList.add('scroll-chevron');

                                const clickOverlay = document.createElement('div');
                                clickOverlay.className = 'scroll-chevron-clickarea';
                                clickOverlay.style.left = '50%';
                                clickOverlay.style.bottom = '0';
                                clickOverlay.style.transform = 'translateX(-50%)';
                                container.appendChild(clickOverlay);

                                const scrollToIntro = () => {
                                    const intro = document.getElementById('intro');
                                    if (intro) {
                                        const navHeight = document.querySelector('.navbar') ? document.querySelector('.navbar').offsetHeight : 0;
                                        const targetPosition = intro.getBoundingClientRect().top + window.pageYOffset - navHeight;
                                        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                                    }
                                };

                                bottomPetal.addEventListener('click', scrollToIntro);
                                clickOverlay.addEventListener('click', scrollToIntro);
                            }, 600);
                        }, 1500);
                    }
                }
            }

            requestAnimationFrame(animateBreathing);
        }

        function expandPetal(index) {
            const state = petalState[index];
            state.targetOffset = hoverExpandAmount;
            if (state.collapseTimeout) clearTimeout(state.collapseTimeout);
            state.collapseTimeout = setTimeout(() => {
                collapsePetal(index);
            }, 800);
        }

        function collapsePetal(index) {
            const state = petalState[index];
            state.targetOffset = 0;
            state.collapseTimeout = null;
        }

        heroSection.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - rect.width / 2;
            const mouseY = e.clientY - rect.top - rect.height / 2;

            for (let i = 0; i < petalState.length; i++) {
                const state = petalState[i];
                const checkX = Math.cos(state.angle) * baseRadius;
                const checkY = Math.sin(state.angle) * baseRadius;
                const dx = mouseX - checkX;
                const dy = mouseY - checkY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {
                    expandPetal(i);
                }
            }
        });

        animateBreathing();
    })();
    </script>
</body>
</html>
