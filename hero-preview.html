<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Preview — 3D Embossed Mandala</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .hero--mandala {
            background: #e0e0e0;
        }
        .hero--mandala::before {
            display: none;
        }
        /* Hide the old DOM-based mandala container */
        .mandala-hover-container {
            display: none;
        }
        #mandala-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .preview-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2d2d2d;
            color: #fff;
            text-align: center;
            padding: 0.5rem 1rem;
            font-family: Inter, sans-serif;
            font-size: 0.85rem;
            z-index: 9999;
        }
        .preview-banner a {
            color: #c4a77d;
            margin-left: 1rem;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="preview-banner">
        Preview: 3D Embossed Mandala (Three.js)
        <a href="index.html">View current homepage</a>
    </div>

    <section class="hero hero--mandala" id="hero-section">
        <canvas id="mandala-canvas"></canvas>
        <div class="hero-content">
            <h1>Come Home to Yourself</h1>
            <p class="hero-subtitle">Get out of your head and back into your body.<br class="desktop-only"> Private sessions, workshops, and men's groups.</p>
            <div class="hero-buttons">
                <a href="#mailing-list" class="btn btn-primary">Join the Mailing List</a>
                <a href="work-with-me.html" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
        <a href="#intro" class="scroll-indicator" aria-label="Scroll to content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
            </svg>
        </a>
    </section>

    <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('mandala-canvas');
    const heroSection = document.getElementById('hero-section');

    // --- Configuration ---
    const isMobile = window.innerWidth <= 768;
    const numChevrons = isMobile ? 6 : 12;
    const baseRadius = isMobile ? 60 : 290;
    const breathAmount = 6;
    const breathDepth = 5;
    const hoverExpandAmount = 40;
    const breathDuration = 8000;
    const hoverEaseSpeed = 0.015;
    const BG_COLOR = 0xe0e0e0;

    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_COLOR);

    // --- Camera (orthographic — flat bas-relief look) ---
    const frustumSize = 450;
    let aspect = canvas.clientWidth / canvas.clientHeight;
    const camera = new THREE.OrthographicCamera(
        -frustumSize * aspect / 2,
         frustumSize * aspect / 2,
         frustumSize / 2,
        -frustumSize / 2,
         0.1, 1000
    );
    camera.position.set(0, 0, 500);
    camera.lookAt(0, 0, 0);

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;

    // --- Ground plane (receives shadows) ---
    const planeGeo = new THREE.PlaneGeometry(1200, 1200);
    const planeMat = new THREE.MeshStandardMaterial({
        color: BG_COLOR, roughness: 0.9, metalness: 0.0
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.position.z = -0.5;
    plane.receiveShadow = true;
    scene.add(plane);

    // --- Lighting ---
    // Directional: low raking light from upper-left
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(-250, 250, 200);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -450;
    dirLight.shadow.camera.right = 450;
    dirLight.shadow.camera.top = 450;
    dirLight.shadow.camera.bottom = -450;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 1000;
    dirLight.shadow.mapSize.width = isMobile ? 1024 : 2048;
    dirLight.shadow.mapSize.height = isMobile ? 1024 : 2048;
    dirLight.shadow.bias = -0.001;
    dirLight.shadow.normalBias = 0.02;
    scene.add(dirLight);

    // Ambient fill
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    // --- Chevron Shape (2D outline of ">" pointing right) ---
    function createChevronShape(armLen, armW, halfAngle) {
        const ca = Math.cos(halfAngle);
        const sa = Math.sin(halfAngle);
        const hw = armW / 2;

        const shape = new THREE.Shape();

        // Tip of the chevron (right side, pointing right)
        shape.moveTo(0, hw * 0.3);

        // Upper arm: inner edge toward back-left
        shape.lineTo(-armLen * ca + hw * sa, armLen * sa + hw * ca);
        // Upper arm: outer edge (cap)
        shape.lineTo(-armLen * ca - hw * sa, armLen * sa - hw * ca);

        // Back to center-top of notch
        shape.lineTo(-hw / ca * 0.6, 0);

        // Lower arm: outer edge
        shape.lineTo(-armLen * ca - hw * sa, -armLen * sa + hw * ca);
        // Lower arm: inner edge
        shape.lineTo(-armLen * ca + hw * sa, -armLen * sa - hw * ca);

        // Back to tip
        shape.lineTo(0, -hw * 0.3);
        shape.closePath();

        return shape;
    }

    const armLen = isMobile ? 18 : 30;
    const armW = isMobile ? 6 : 9;
    const chevronShape = createChevronShape(armLen, armW, Math.PI / 4);

    const extrudeSettings = {
        depth: 6,
        bevelEnabled: true,
        bevelThickness: 1.5,
        bevelSize: 1,
        bevelSegments: isMobile ? 1 : 3,
        steps: 1,
    };

    const chevronGeometry = new THREE.ExtrudeGeometry(chevronShape, extrudeSettings);
    // Center the geometry so extrusion goes from -depth/2 to +depth/2
    chevronGeometry.translate(0, 0, -extrudeSettings.depth / 2);

    // --- Create chevron meshes in a ring ---
    const chevronMeshes = [];
    const chevronMaterials = [];
    const chevronState = [];

    const entranceDelay = 300;
    const entranceDuration = 2000;
    const entranceStartRadius = 1.4;
    let entranceStartTime = null; // set on first frame
    let entranceComplete = false;
    let bottomFlipped = false;
    const bottomIndex = Math.floor(numChevrons * 0.25);

    for (let i = 0; i < numChevrons; i++) {
        const angle = (i / numChevrons) * Math.PI * 2;

        const mat = new THREE.MeshStandardMaterial({
            color: BG_COLOR,
            roughness: 0.85,
            metalness: 0.0,
            transparent: true,
            opacity: 0,
        });

        const mesh = new THREE.Mesh(chevronGeometry, mat);

        // Position on ring
        mesh.position.x = Math.cos(angle) * baseRadius * entranceStartRadius;
        mesh.position.y = Math.sin(angle) * baseRadius * entranceStartRadius;
        mesh.position.z = 0;

        // Rotate so ">" tip points inward (toward center)
        mesh.rotation.z = angle + Math.PI;

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        scene.add(mesh);
        chevronMeshes.push(mesh);
        chevronMaterials.push(mat);
        chevronState.push({
            angle: angle,
            currentOffset: 0,
            targetOffset: 0,
            collapseTimeout: null,
            entranceStagger: i * (300 / numChevrons),
        });
    }

    // --- Animation ---
    function animate(time) {
        requestAnimationFrame(animate);

        if (entranceStartTime === null) {
            entranceStartTime = time + entranceDelay;
        }

        const breathProgress = (time % breathDuration) / breathDuration;
        const breathSin = Math.sin(breathProgress * Math.PI * 2);
        const breathValue = (breathSin + 1) / 2; // 0 to 1

        for (let i = 0; i < numChevrons; i++) {
            const mesh = chevronMeshes[i];
            const mat = chevronMaterials[i];
            const state = chevronState[i];

            // Hover interpolation
            state.currentOffset += (state.targetOffset - state.currentOffset) * hoverEaseSpeed;

            // Entrance
            let entranceProgress = 1;
            let entranceRadiusMultiplier = 1;
            let entranceOpacity = 1;

            if (!entranceComplete) {
                const elapsed = time - entranceStartTime - state.entranceStagger;
                if (elapsed < 0) {
                    entranceProgress = 0;
                } else if (elapsed < entranceDuration) {
                    const t = elapsed / entranceDuration;
                    entranceProgress = 1 - Math.pow(1 - t, 3);
                }
                entranceRadiusMultiplier = entranceStartRadius - (entranceStartRadius - 1) * entranceProgress;
                entranceOpacity = Math.min(1, entranceProgress * 3);
                mat.opacity = entranceOpacity;
                mat.transparent = entranceOpacity < 1;
            }

            // Radial breathing + hover
            const breathOffset = breathSin * breathAmount;
            const currentRadius = (baseRadius + breathOffset + state.currentOffset) * entranceRadiusMultiplier;

            mesh.position.x = Math.cos(state.angle) * currentRadius;
            mesh.position.y = Math.sin(state.angle) * currentRadius;

            // Z breathing: shapes rise and settle from the surface
            mesh.position.z = breathValue * breathDepth;

            // Scroll indicator: bottom chevron points down after entrance
            if (i === bottomIndex && bottomFlipped) {
                mesh.rotation.z = Math.PI / 2 + Math.PI; // points downward
                // Gentle bounce
                const bounce = Math.sin(time * 0.003) * 5;
                mesh.position.y = Math.sin(state.angle) * currentRadius + bounce;
            }
        }

        // Check entrance completion
        if (!entranceComplete) {
            const lastFinish = entranceStartTime +
                chevronState[chevronState.length - 1].entranceStagger + entranceDuration;
            if (time > lastFinish) {
                entranceComplete = true;
                for (const mat of chevronMaterials) {
                    mat.transparent = false;
                    mat.opacity = 1;
                }
                // Flip bottom chevron after 1.5s
                if (!isMobile) {
                    setTimeout(() => {
                        bottomFlipped = true;
                    }, 1500);
                }
            }
        }

        renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // --- Mouse interaction ---
    function getWorldFromMouse(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
        const ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;
        return {
            x: ndcX * (frustumSize * aspect / 2),
            y: ndcY * (frustumSize / 2),
        };
    }

    function expandChevron(index) {
        const state = chevronState[index];
        state.targetOffset = hoverExpandAmount;
        if (state.collapseTimeout) clearTimeout(state.collapseTimeout);
        state.collapseTimeout = setTimeout(() => {
            state.targetOffset = 0;
            state.collapseTimeout = null;
        }, 800);
    }

    heroSection.addEventListener('mousemove', (e) => {
        const world = getWorldFromMouse(e.clientX, e.clientY);
        for (let i = 0; i < chevronState.length; i++) {
            const state = chevronState[i];
            const baseX = Math.cos(state.angle) * baseRadius;
            const baseY = Math.sin(state.angle) * baseRadius;
            const dx = world.x - baseX;
            const dy = world.y - baseY;
            if (Math.sqrt(dx * dx + dy * dy) < 100) {
                expandChevron(i);
            }
        }
    });

    // Touch support
    if (isMobile) {
        canvas.addEventListener('touchstart', handleTouch, { passive: true });
        canvas.addEventListener('touchmove', handleTouch, { passive: true });
    }
    function handleTouch(e) {
        const touch = e.touches[0];
        const world = getWorldFromMouse(touch.clientX, touch.clientY);
        for (let i = 0; i < chevronState.length; i++) {
            const state = chevronState[i];
            const baseX = Math.cos(state.angle) * baseRadius;
            const baseY = Math.sin(state.angle) * baseRadius;
            const dx = world.x - baseX;
            const dy = world.y - baseY;
            if (Math.sqrt(dx * dx + dy * dy) < 60) {
                expandChevron(i);
            }
        }
    }

    // --- Resize handler ---
    function onResize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        aspect = width / height;

        camera.left = -frustumSize * aspect / 2;
        camera.right = frustumSize * aspect / 2;
        camera.top = frustumSize / 2;
        camera.bottom = -frustumSize / 2;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener('resize', onResize);
    </script>
</body>
</html>
