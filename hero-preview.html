<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Preview — 3D Embossed Mandala</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .hero--mandala {
            background: #ffffff;
        }
        .hero--mandala::before {
            display: none;
        }
        /* Hide the old DOM-based mandala container */
        .mandala-hover-container {
            display: none;
        }
        #mandala-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .preview-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2d2d2d;
            color: #fff;
            text-align: center;
            padding: 0.5rem 1rem;
            font-family: Inter, sans-serif;
            font-size: 0.85rem;
            z-index: 9999;
        }
        .preview-banner a {
            color: #c4a77d;
            margin-left: 1rem;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="preview-banner">
        Preview: 3D Embossed Mandala (Three.js)
        <a href="index.html">View current homepage</a>
    </div>

    <section class="hero hero--mandala" id="hero-section">
        <canvas id="mandala-canvas"></canvas>
        <div class="hero-content">
            <h1>Come Home to Yourself</h1>
            <p class="hero-subtitle">Get out of your head and back into your body.<br class="desktop-only"> Private sessions, workshops, and men's groups.</p>
            <div class="hero-buttons">
                <a href="#mailing-list" class="btn btn-primary">Join the Mailing List</a>
                <a href="work-with-me.html" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
        <a href="#intro" class="scroll-indicator" aria-label="Scroll to content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
            </svg>
        </a>
    </section>

    <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('mandala-canvas');
    const heroSection = document.getElementById('hero-section');

    // --- Configuration ---
    const isMobile = window.innerWidth <= 768;
    const numChevrons = isMobile ? 6 : 12;
    const baseRadius = isMobile ? 50 : 130;
    const breathAmount = 4;
    const breathDepth = 4;
    const hoverExpandAmount = 20;
    const breathDuration = 8000;
    const hoverEaseSpeed = 0.015;
    const BG_COLOR = 0xffffff;

    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_COLOR);

    // --- Camera (orthographic, slight tilt for depth) ---
    const frustumSize = 450;
    let aspect = canvas.clientWidth / canvas.clientHeight;
    const camera = new THREE.OrthographicCamera(
        -frustumSize * aspect / 2,
         frustumSize * aspect / 2,
         frustumSize / 2,
        -frustumSize / 2,
         0.1, 2000
    );
    // Slight angle — looking down at about 15° from vertical
    camera.position.set(0, -120, 480);
    camera.lookAt(0, 0, 0);

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;

    // --- Studio environment map (realistic ambient lighting from all directions) ---
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnv = new RoomEnvironment();
    const envMap = pmremGenerator.fromScene(roomEnv).texture;
    scene.environment = envMap;
    roomEnv.dispose();
    pmremGenerator.dispose();

    // --- Ground plane (white, receives shadows) ---
    const planeGeo = new THREE.PlaneGeometry(2000, 2000);
    const planeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 1.0, metalness: 0.0, envMapIntensity: 0.5,
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.position.z = -0.5;
    plane.receiveShadow = true;
    scene.add(plane);

    // --- Lighting ---
    // Directional: raking light from upper-left for shadow casting
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(-200, 200, 100);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -250;
    dirLight.shadow.camera.right = 250;
    dirLight.shadow.camera.top = 250;
    dirLight.shadow.camera.bottom = -250;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 800;
    dirLight.shadow.mapSize.width = isMobile ? 1024 : 4096;
    dirLight.shadow.mapSize.height = isMobile ? 1024 : 4096;
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0.01;
    scene.add(dirLight);

    // --- Rectangle geometry with beveled edges (catches highlights like real 3D) ---
    const rectW = isMobile ? 20 : 30;
    const rectH = isMobile ? 6 : 9;
    const rectD = isMobile ? 3 : 5;
    const bevel = 0.8;
    const rectShape = new THREE.Shape();
    rectShape.moveTo(-rectW / 2 + bevel, -rectH / 2);
    rectShape.lineTo(rectW / 2 - bevel, -rectH / 2);
    rectShape.quadraticCurveTo(rectW / 2, -rectH / 2, rectW / 2, -rectH / 2 + bevel);
    rectShape.lineTo(rectW / 2, rectH / 2 - bevel);
    rectShape.quadraticCurveTo(rectW / 2, rectH / 2, rectW / 2 - bevel, rectH / 2);
    rectShape.lineTo(-rectW / 2 + bevel, rectH / 2);
    rectShape.quadraticCurveTo(-rectW / 2, rectH / 2, -rectW / 2, rectH / 2 - bevel);
    rectShape.lineTo(-rectW / 2, -rectH / 2 + bevel);
    rectShape.quadraticCurveTo(-rectW / 2, -rectH / 2, -rectW / 2 + bevel, -rectH / 2);

    const barGeometry = new THREE.ExtrudeGeometry(rectShape, {
        depth: rectD,
        bevelEnabled: true,
        bevelThickness: 0.6,
        bevelSize: 0.5,
        bevelSegments: isMobile ? 2 : 4,
        steps: 1,
    });
    barGeometry.translate(0, 0, -rectD / 2);

    // --- Create chevron meshes in a ring ---
    const chevronMeshes = [];
    const chevronMaterials = [];
    const chevronState = [];

    const entranceDelay = 300;
    const entranceDuration = 2000;
    const entranceStartRadius = 1.4;
    let entranceStartTime = null; // set on first frame
    let entranceComplete = false;
    let bottomFlipped = false;
    const bottomIndex = Math.floor(numChevrons * 0.25);

    for (let i = 0; i < numChevrons; i++) {
        const angle = (i / numChevrons) * Math.PI * 2;

        const mat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            roughness: 0.35,
            metalness: 0.0,
            clearcoat: 0.1,
            clearcoatRoughness: 0.4,
            envMapIntensity: 0.8,
        });

        const mesh = new THREE.Mesh(barGeometry, mat);

        // Position on ring
        mesh.position.x = Math.cos(angle) * baseRadius * entranceStartRadius;
        mesh.position.y = Math.sin(angle) * baseRadius * entranceStartRadius;
        mesh.position.z = rectD / 2;

        // Rotate so long axis points toward center
        mesh.rotation.z = angle;

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        scene.add(mesh);
        chevronMeshes.push(mesh);
        chevronMaterials.push(mat);
        chevronState.push({
            angle: angle,
            currentOffset: 0,
            targetOffset: 0,
            collapseTimeout: null,
            entranceStagger: i * (300 / numChevrons),
        });
    }

    // --- Animation ---
    function animate(time) {
        requestAnimationFrame(animate);

        if (entranceStartTime === null) {
            entranceStartTime = time + entranceDelay;
        }

        const breathProgress = (time % breathDuration) / breathDuration;
        const breathSin = Math.sin(breathProgress * Math.PI * 2);
        const breathValue = (breathSin + 1) / 2; // 0 to 1

        for (let i = 0; i < numChevrons; i++) {
            const mesh = chevronMeshes[i];
            const mat = chevronMaterials[i];
            const state = chevronState[i];

            // Hover interpolation
            state.currentOffset += (state.targetOffset - state.currentOffset) * hoverEaseSpeed;

            // Entrance
            let entranceProgress = 1;
            let entranceRadiusMultiplier = 1;
            let entranceOpacity = 1;

            if (!entranceComplete) {
                const elapsed = time - entranceStartTime - state.entranceStagger;
                if (elapsed < 0) {
                    entranceProgress = 0;
                } else if (elapsed < entranceDuration) {
                    const t = elapsed / entranceDuration;
                    entranceProgress = 1 - Math.pow(1 - t, 3);
                }
                entranceRadiusMultiplier = entranceStartRadius - (entranceStartRadius - 1) * entranceProgress;
            }

            // Radial breathing + hover
            const breathOffset = breathSin * breathAmount;
            const currentRadius = (baseRadius + breathOffset + state.currentOffset) * entranceRadiusMultiplier;

            mesh.position.x = Math.cos(state.angle) * currentRadius;
            mesh.position.y = Math.sin(state.angle) * currentRadius;

            // Z breathing: shapes rise and settle from the surface
            mesh.position.z = breathValue * breathDepth;

            // Scroll indicator: bottom bar gets a gentle bounce
            if (i === bottomIndex && bottomFlipped) {
                const bounce = Math.sin(time * 0.003) * 3;
                mesh.position.y = Math.sin(state.angle) * currentRadius + bounce;
            }
        }

        // Check entrance completion
        if (!entranceComplete) {
            const lastFinish = entranceStartTime +
                chevronState[chevronState.length - 1].entranceStagger + entranceDuration;
            if (time > lastFinish) {
                entranceComplete = true;
                // Flip bottom chevron after 1.5s
                if (!isMobile) {
                    setTimeout(() => {
                        bottomFlipped = true;
                    }, 1500);
                }
            }
        }

        renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // --- Mouse interaction ---
    function getWorldFromMouse(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
        const ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;
        return {
            x: ndcX * (frustumSize * aspect / 2),
            y: ndcY * (frustumSize / 2),
        };
    }

    function expandChevron(index) {
        const state = chevronState[index];
        state.targetOffset = hoverExpandAmount;
        if (state.collapseTimeout) clearTimeout(state.collapseTimeout);
        state.collapseTimeout = setTimeout(() => {
            state.targetOffset = 0;
            state.collapseTimeout = null;
        }, 800);
    }

    heroSection.addEventListener('mousemove', (e) => {
        const world = getWorldFromMouse(e.clientX, e.clientY);
        for (let i = 0; i < chevronState.length; i++) {
            const state = chevronState[i];
            const baseX = Math.cos(state.angle) * baseRadius;
            const baseY = Math.sin(state.angle) * baseRadius;
            const dx = world.x - baseX;
            const dy = world.y - baseY;
            if (Math.sqrt(dx * dx + dy * dy) < 50) {
                expandChevron(i);
            }
        }
    });

    // Touch support
    if (isMobile) {
        canvas.addEventListener('touchstart', handleTouch, { passive: true });
        canvas.addEventListener('touchmove', handleTouch, { passive: true });
    }
    function handleTouch(e) {
        const touch = e.touches[0];
        const world = getWorldFromMouse(touch.clientX, touch.clientY);
        for (let i = 0; i < chevronState.length; i++) {
            const state = chevronState[i];
            const baseX = Math.cos(state.angle) * baseRadius;
            const baseY = Math.sin(state.angle) * baseRadius;
            const dx = world.x - baseX;
            const dy = world.y - baseY;
            if (Math.sqrt(dx * dx + dy * dy) < 60) {
                expandChevron(i);
            }
        }
    }

    // --- Resize handler ---
    function onResize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        aspect = width / height;

        camera.left = -frustumSize * aspect / 2;
        camera.right = frustumSize * aspect / 2;
        camera.top = frustumSize / 2;
        camera.bottom = -frustumSize / 2;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener('resize', onResize);
    </script>
</body>
</html>
